name: SoWork Keep Alive

on:
  schedule:
    # QUAN TRỌNG: TRÁNH phút :00 đầu giờ — đó là lúc scheduler GitHub nghẽn nặng nhất,
    # lượt đúng :00 hay bị HOÃN 15–45 phút hoặc BỎ LUỘT. Trước đây lượt sáng rơi đúng
    # 00:00 UTC (07:00 VN) nên hay KHÔNG lên online buổi sáng.
    #
    # Giờ sáng đầu ngày (00:00–00:59 UTC = 07:00–07:59 VN): chạy DÀY (~8 phút/lượt)
    # để chắc chắn bắt được ca đầu ngày ngay cả khi vài lượt bị bỏ.
    - cron: '6,14,22,30,38,46,54 0 * * 1-5'
    # Trong ngày (01:00–15:00 UTC = 08:00–22:00 VN): mỗi 20 phút, LỆCH khỏi phút :00.
    - cron: '5,25,45 1-15 * * 1-5'
    #
    # Mỗi lượt trước tiên KIỂM TRA đã online chưa:
    #   - Đang online (một ca khác đang giữ) -> thoát ngay, không đá phiên, không tốn thời gian.
    #   - Chưa online -> mới thật sự giữ phiên (RUN_MINUTES).
  workflow_dispatch: # Cho phép bấm chạy thủ công

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    # Image chính thức của Playwright: đã cài sẵn Node 20 + Chromium + thư viện hệ thống.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-jammy
    timeout-minutes: 350

    steps:
    - name: Kiểm tra mã nguồn
      uses: actions/checkout@v4

    - name: Kiểm tra đã online chưa (nhanh, không cần trình duyệt)
      id: precheck
      env:
        SOWORK_SESSION: ${{ secrets.SOWORK_SESSION }}
      run: |
        STATE=$(node check-online.js 2>/dev/null || echo UNKNOWN)
        echo "Ket qua: $STATE"
        echo "state=$STATE" >> "$GITHUB_OUTPUT"

    - name: Cài gói playwright (JS) — browser đã có sẵn trong image
      if: steps.precheck.outputs.state != 'ONLINE'
      env:
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      run: npm install playwright@1.62.1 --no-save

    - name: Giữ trạng thái Online
      if: steps.precheck.outputs.state != 'ONLINE'
      env:
        SOWORK_SESSION: ${{ secrets.SOWORK_SESSION }}
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_USER_ID: ${{ secrets.SLACK_USER_ID }}
        RUN_MINUTES: '340'   # giữ ~5h40m; khi kết thúc, lượt cron kế (≤20 phút sau) sẽ nối tiếp
        STOP_HOUR_VN: '23'
      run: node keepalive.js

    - name: Lưu ảnh chụp lỗi (nếu có)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: keepalive-error
        path: keepalive-error.png
        if-no-files-found: ignore

    - name: Báo Slack khi job lỗi
      if: failure()
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_USER_ID: ${{ secrets.SLACK_USER_ID }}
      run: |
        if [ -n "$SLACK_WEBHOOK_URL" ]; then
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          MENTION=""
          if [ -n "$SLACK_USER_ID" ]; then MENTION="<@$SLACK_USER_ID> "; fi
          curl -s -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\"${MENTION}❌ *SoWork Keep Alive* job THẤT BẠI. Xem log: $RUN_URL\",\"link_names\":1}" \
            "$SLACK_WEBHOOK_URL" || true
        fi

name: SoWork Keep Alive

on:
  schedule:
    # MỤC TIÊU: Online 24h các ngày trong tuần (T2–T6 giờ VN), NGHỈ Thứ 7 & Chủ Nhật.
    # VN = UTC+7, nên "T2 00:00 → T6 24:00 VN" = "CN 17:00 → T6 17:00 UTC". Chia 3 dòng cron:
    #
    # TRÁNH phút :00 (scheduler GitHub nghẽn nhất, hay hoãn/bỏ lượt) -> dùng phút lệch, mỗi ~15'.
    - cron: '3,18,33,48 17-23 * * 0'   # CN 17:00–23:59 UTC = T2 00:00–06:59 VN
    - cron: '3,18,33,48 * * * 1-4'     # T2–T5 cả ngày UTC   = T2 07:00 → T6 06:59 VN
    - cron: '3,18,33,48 0-16 * * 5'    # T6 00:00–16:59 UTC  = T6 07:00–23:59 VN
    #
    # Mỗi lượt trước tiên KIỂM TRA đã online chưa:
    #   - Đang online (một ca khác đang giữ) -> thoát ngay, không đá phiên, không tốn thời gian.
    #   - Chưa online -> mới thật sự giữ phiên (RUN_MINUTES); cron ~15' sẽ nối tiếp khi hết ca.
  workflow_dispatch: # Cho phép bấm chạy thủ công

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    # Image chính thức của Playwright: đã cài sẵn Node 20 + Chromium + thư viện hệ thống.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-jammy
    timeout-minutes: 350

    steps:
    - name: Kiểm tra mã nguồn
      uses: actions/checkout@v4

    - name: Kiểm tra đã online chưa (nhanh, không cần trình duyệt)
      id: precheck
      env:
        SOWORK_SESSION: ${{ secrets.SOWORK_SESSION }}
      run: |
        STATE=$(node check-online.js 2>/dev/null || echo UNKNOWN)
        echo "Ket qua: $STATE"
        echo "state=$STATE" >> "$GITHUB_OUTPUT"

    - name: Cài gói playwright (JS) — browser đã có sẵn trong image
      if: steps.precheck.outputs.state != 'ONLINE'
      env:
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      run: npm install playwright@1.62.1 --no-save

    - name: Giữ trạng thái Online
      if: steps.precheck.outputs.state != 'ONLINE'
      env:
        SOWORK_SESSION: ${{ secrets.SOWORK_SESSION }}
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_USER_ID: ${{ secrets.SLACK_USER_ID }}
        RUN_MINUTES: '340'   # giữ ~5h40m; khi hết ca, lượt cron kế (≤15 phút sau) nối tiếp
        CONTINUOUS: '1'      # giữ Online 24h T2–T6; chỉ tự dừng khi sang cuối tuần (giờ VN)
      run: node keepalive.js

    - name: Lưu ảnh chụp lỗi (nếu có)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: keepalive-error
        path: keepalive-error.png
        if-no-files-found: ignore

    - name: Báo Slack khi job lỗi
      if: failure()
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_USER_ID: ${{ secrets.SLACK_USER_ID }}
      run: |
        if [ -n "$SLACK_WEBHOOK_URL" ]; then
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          MENTION=""
          if [ -n "$SLACK_USER_ID" ]; then MENTION="<@$SLACK_USER_ID> "; fi
          curl -s -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\"${MENTION}❌ *SoWork Keep Alive* job THẤT BẠI. Xem log: $RUN_URL\",\"link_names\":1}" \
            "$SLACK_WEBHOOK_URL" || true
        fi
